name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Best Practice: Principle of least privilege globally
permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    # Best Practice: Always set a timeout to prevent hanging tasks from burning Action minutes
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "::error::Unformatted files found. Run 'gofmt -w .' locally."
            gofmt -l .
            exit 1
          fi

      - name: check the embedded registry is in sync
        run: |
          go generate ./...
          git diff --exit-code -- pkg/registry/data/ \
            || { echo "::error::pkg/registry/data is stale; run 'make generate' and commit the result"; exit 1; }

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -race -count=1 -coverprofile=coverage.out -covermode=atomic

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: install golangci-lint
        run: |
          # Install the golangci-lint tool using 'go install' which avoids Node-based actions
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: run golangci-lint
        run: |
          # Run the linter; failure here should reflect actual lint problems
          golangci-lint run --timeout=5m

  security:
    name: vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: install govulncheck
        run: |
          # Install govulncheck via 'go install' to avoid the action's tar/cache steps
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: run govulncheck
        run: |
          # Run the vulnerability check across the module
          govulncheck ./...

  build-and-smoke:
    name: build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Best Practice: Gate downstream tasks. Only run if tests, lints, and security checks pass.
    needs: [test, lint, security]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build binaries for linux/amd64
        run: |
          GOOS=linux GOARCH=amd64 go build -o polyql ./cmd/polyql
          GOOS=linux GOARCH=amd64 go build -o polyql-proxy ./cmd/polyql-proxy

      - name: smoke tests
        run: |
          ./polyql version
          ./polyql registry list
          ./polyql translate --from promql --to logql --query 'up'
          ./polyql translate --from traceql --to traceql --query '{span.http.status_code = 500}'
          ./polyql translate --from traceql --to logql --query '{resource.service.name = "web"}'
          # Piped input: documented since the first commit, implemented later.
          # A smoke step is what stops it regressing back into a claim.
          printf 'up\nrate(x[5m])\n' | ./polyql translate --from promql --to promql --format query-only
          echo 'up' | ./polyql translate --from promql --to logql --file - --format query-only
          # The report format is --report-format; the dashboard command has no
          # --format of its own, and using one silently never ran here because
          # this job was gated behind jobs that were failing.
          ./polyql dashboard translate --from promql --to logql --input testdata/dashboards/sample_promql.json --report-format json > /dev/null

      - name: proxy smoke test
        run: |
          # A stub backend, so this exercises the proxy without a real Loki.
          python3 - <<'EOF' &
          import http.server, json
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  body = json.dumps({"status": "success", "data": {}}).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *a): pass
          http.server.HTTPServer(("127.0.0.1", 3100), H).serve_forever()
          EOF
          ./polyql-proxy --source-dsl promql --to-dsl logql \
            --upstream http://127.0.0.1:3100 --listen 127.0.0.1:9099 &
          sleep 2
          # Health answers without touching the backend.
          curl -fsS http://127.0.0.1:9099/healthz
          # A translatable query is forwarded and reports what it cost.
          curl -fsS -D /tmp/headers -o /dev/null \
            "http://127.0.0.1:9099/api/v1/query?query=rate(http_requests_total%5B5m%5D)"
          grep -qi "X-Polyql-Fidelity-Score" /tmp/headers
          # An incomplete translation is refused rather than forwarded. Fail the
          # job if this ever starts returning 200.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "http://127.0.0.1:9099/api/v1/query?query=histogram_quantile(0.99,x)")
          test "$code" = "400" || { echo "::error::the proxy forwarded an incomplete translation (got $code)"; exit 1; }
          ./polyql-proxy version

      - name: verify exit codes
        run: |
          ./polyql translate --from promql --to logql --query 'rate(http_requests_total{status="500"}[5m])' >/dev/null
          ./polyql translate --from promql --to logql --query 'histogram_quantile(0.99, x)' --format json >/dev/null || true

  vhs-demo-check:
    name: vhs demo check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: validate VHS tape compiles cleanly
        uses: charmbracelet/vhs-action@v2
        with:
          path: assets/demo.tape   # Changed from 'tape' to 'path'