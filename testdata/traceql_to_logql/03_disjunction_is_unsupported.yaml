name: disjunctive spanset filter over one attribute
description: An OR that is really set membership, folded into a regex alternation.
source_dsl: traceql
target_dsl: logql
input: '{resource.service.name = "web" || resource.service.name = "api"}'
expected_output: '{resource_service_name=~"web|api"}'
notes: >
  A LogQL stream selector puts an implicit "and" between its matchers, so a
  general disjunction has no form there at all. This one is not general: several
  alternatives for a single attribute are set membership, which is exactly what
  the IR's IN predicate means and what both conjunctive targets already write as
  a regex alternation. Recognizing it turns a query LogQL would otherwise refuse
  outright into one it writes exactly.
  The fold is faithful rather than approximate, and only because both conditions
  hold: LogQL anchors a label regex end to end, so the alternation matches whole
  values and nothing wider, and each value is escaped on the way out, so a dot in
  a service name stays a dot.
